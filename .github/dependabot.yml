version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo-minor: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /fuzz
    schedule: { interval: monthly }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
