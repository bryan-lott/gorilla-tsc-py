# Build wheels and an sdist; on a version tag, attach them to a GitHub Release.
# Nothing is published to PyPI or crates.io.
#
#   Release: bump the version in Cargo.toml and pyproject.toml, date the
#   CHANGELOG section, then `git tag v0.2.0 && git push origin v0.2.0`.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - Cargo.toml
      - crates/gorilla-tsc-py/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: tag matches versions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          tag=${GITHUB_REF_NAME#v}
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          py=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag $tag, Cargo.toml $cargo, pyproject.toml $py"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$py" ]
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$tag] section"; exit 1; }

  wheels:
    name: wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --locked --out dist
      # Install the built wheel (not the source tree) and run the Python suite against it.
      - if: matrix.test
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: matrix.test
        shell: bash
        run: |
          uv venv --python 3.13 .wheel-venv
          uv pip install --python .wheel-venv dist/*.whl pytest hypothesis
          if [ -x .wheel-venv/Scripts/python.exe ]; then py=.wheel-venv/Scripts/python.exe; else py=.wheel-venv/bin/python; fi
          "$py" -m pytest -q -p no:cacheprovider tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist; head -20 notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
