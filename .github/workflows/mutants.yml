# Full mutation run over both crates, weekly: every mutant must be caught
# (equivalent ones are excluded, with reasons, in .cargo/mutants.toml).
name: Mutants

on:
  schedule:
    - cron: "23 8 * * 0" # Sundays, 01:23 MST
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    strategy:
      fail-fast: false
      matrix:
        package: [gorilla-tsc, gorilla-tsc-py]
    name: mutants (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants
      - name: cargo mutants
        # Exit 3 = some mutants timed out (an infinite loop: detected) and none were missed.
        run: cargo mutants -p ${{ matrix.package }} -j 3 --timeout 120 || { rc=$?; [ "$rc" -eq 3 ] || exit "$rc"; }
        env:
          GTSC_PYTHON: ${{ github.workspace }}/.venv/bin/python
          HYPOTHESIS_PROFILE: mutants
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.package }}
          path: mutants.out
