[workspace]
members = ["crates/gorilla-tsc", "crates/gorilla-tsc-py"]
resolver = "3"
exclude = ["experiments", "fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Oldest Rust that builds the libraries (tests may need newer: dev-dependencies).
rust-version = "1.87"
authors = ["Bryan Lott <bryan.lott@pm.me>"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
